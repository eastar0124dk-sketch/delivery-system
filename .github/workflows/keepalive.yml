name: Keep Render Awake

# Render 무료 플랜은 15분간 요청이 없으면 서버를 재움(콜드스타트 ~50초).
# 업무 시간(KST 월~토 06:00~20:00)에 10분마다 핑을 보내 항상 깨어있게 유지.
# cron은 UTC 기준 (KST = UTC+9)

on:
  schedule:
    - cron: '*/10 21-23 * * 0-5'   # KST 월~토 06:00~08:59
    - cron: '*/10 0-10 * * 1-6'    # KST 월~토 09:00~19:59
  workflow_dispatch:               # 수동 실행 버튼

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping delivery-system
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "https://delivery-system-r6pr.onrender.com/api/config" || echo "fail")
          echo "delivery-system: $CODE"
